# =============================================================================
# ECOIMPACT APPLICATION CONFIGURATION
# Default profile: In-Memory H2 with MySQL mode compatibility for zero-friction hackathon execution
# Production profile: MySQL 8.0+ via spring.profiles.active=mysql
# =============================================================================

server.port=8080

spring.application.name=EcoImpact

# Default in-memory database with MySQL syntax compatibility
spring.datasource.url=jdbc:h2:mem:ecoimpactdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Execute schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Console for rapid debugging during presentations
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.com.ecoimpact=INFO
logging.level.org.springframework.web=INFO
